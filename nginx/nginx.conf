# Reverse proxy fronting the whole stack: routes /api to FastAPI, everything
# else to the built React app. Used by the top-level docker-compose "nginx"
# service; the frontend container also carries its own minimal config
# (frontend/nginx.frontend.conf) for standalone use.
server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    # Generated images served by the backend's LocalStorageService fallback
    # (used whenever S3/R2 isn't configured — see storage_service.py).
    location /media/ {
        proxy_pass http://backend:8000;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
